<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDT Faucet</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101828;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }

    .box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .reward {
      background: #f2f4f7;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
    }

    input {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #26a17b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>USDT Faucet</h1>

    <p>Claim your free USDT reward.</p>

    <div class="reward">
      Reward per claim<br>
      <strong>0.001 USDT</strong>
    </div>

    <input
      type="email"
      id="email"
      placeholder="FaucetPay Email"
    >

    <button id="claimButton" onclick="claim()">
      CLAIM USDT
    </button>

    <div id="message"></div>

  </div>

  <script>

    const WORKER_URL =
      "https://khaled-usdt-faucet.khaledalhadi26.workers.dev/";

    async function claim() {

      const email =
        document.getElementById("email").value.trim();

      const button =
        document.getElementById("claimButton");

      const message =
        document.getElementById("message");

      if (!email || !email.includes("@")) {
        message.textContent =
          "Please enter a valid FaucetPay email.";
        return;
      }

      button.disabled = true;
      button.textContent = "PROCESSING...";

      try {

        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email
          })
        });

        const result = await response.json();

        if (result.success) {
          message.textContent =
            "Request received successfully.";
        } else {
          message.textContent =
            result.message || "Request failed.";
        }

      } catch (error) {

        message.textContent =
          "Unable to connect to the server.";

      }

      button.disabled = false;
      button.textContent = "CLAIM USDT";
    }

  </script>

</body>
</html>
