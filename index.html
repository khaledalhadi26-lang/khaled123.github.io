<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDT Faucet</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101828, #1d2939);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      color: #101828;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #26a17b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      color: white;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    .description {
      color: #667085;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .reward {
      background: #f2f4f7;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .reward strong {
      display: block;
      font-size: 24px;
      margin-top: 5px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }

    input:focus {
      border-color: #26a17b;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #26a17b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      min-height: 24px;
      font-weight: bold;
    }

    .footer {
      margin-top: 25px;
      color: #98a2b3;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">₮</div>

    <h1>USDT Faucet</h1>

    <p class="description">
      Claim your free USDT reward.
    </p>

    <div class="reward">
      <span>Reward per claim</span>
      <strong>0.001 USDT</strong>
    </div>

    <label for="email">FaucetPay Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your FaucetPay email"
      autocomplete="email"
    >

    <button id="claimButton" onclick="claim()">
      CLAIM USDT
    </button>

    <div id="message"></div>

    <div class="footer">
      Powered by USDT Faucet
    </div>

  </div>

  <script>
    function claim() {
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message");
      const button = document.getElementById("claimButton");

      if (!email) {
        message.textContent = "Please enter your FaucetPay email.";
        return;
      }

      if (!email.includes("@")) {
        message.textContent = "Please enter a valid email address.";
        return;
      }

      message.textContent =
        "Your claim request has been received. Payment system will be connected soon.";

      button.disabled = true;
      button.textContent = "PLEASE WAIT...";

      setTimeout(function() {
        button.disabled = false;
        button.textContent = "CLAIM USDT";
      }, 10000);
    }
  </script>

</body>
</html>
