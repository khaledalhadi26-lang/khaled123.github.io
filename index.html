<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Khaled Faucet</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}

.container {
    width: 100%;
    max-width: 450px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,.10);
}

h1 {
    text-align: center;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #666;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.send {
    background: #222;
    color: white;
}

.verify {
    background: #1769aa;
    color: white;
}

.claim {
    background: #16a34a;
    color: white;
}

.withdraw {
    background: #f59e0b;
    color: white;
}

.card {
    margin-top: 20px;
    padding: 20px;
    text-align: center;
    background: #f7f7f7;
    border-radius: 10px;
}

.points {
    font-size: 30px;
    font-weight: bold;
    margin-top: 10px;
}

.usdt {
    margin-top: 10px;
    font-size: 16px;
    color: #555;
}

.message {
    margin-top: 15px;
    text-align: center;
    min-height: 22px;
}

.hidden {
    display: none;
}

.small {
    font-size: 13px;
    color: #777;
    text-align: center;
    margin-top: 10px;
}

</style>

</head>


<body>

<div class="container">

<h1>Khaled Faucet</h1>

<p class="subtitle">
Earn points every 60 seconds.
</p>


<!-- EMAIL -->

<div id="emailSection">

<label>
FaucetPay Email
</label>

<input
id="email"
type="email"
placeholder="you@example.com"
autocomplete="email"
>

<button
class="send"
id="sendOtp"
onclick="sendOTP()"
>
Send Verification Code
</button>

</div>


<!-- OTP -->

<div
id="otpSection"
class="hidden"
>

<label>
Verification Code
</label>

<input
id="otp"
type="text"
inputmode="numeric"
maxlength="6"
placeholder="6-digit code"
>

<button
class="verify"
id="verifyOtp"
onclick="verifyOTP()"
>
Verify Email
</button>

<button
id="resendButton"
onclick="sendOTP()"
>
Send Code Again
</button>

</div>


<!-- USER -->

<div
id="userSection"
class="hidden"
>

<div class="card">

<div>
Your Points
</div>

<div
id="points"
class="points"
>
0
</div>

<div class="small">
100,000,000 points = 1 USDT
</div>

</div>


<button
id="claimButton"
class="claim"
onclick="claim()"
>
Claim 100,000,000 Points
</button>


<button
id="withdrawButton"
class="withdraw"
onclick="withdraw()"
>
Withdraw USDT
</button>


<div
id="cooldown"
class="message"
>
</div>


<div class="small">
Minimum withdrawal: 100,000,000 points
</div>

</div>


<div
id="message"
class="message"
>
</div>


</div>


<script>

const API =
"https://khaled-usdt-faucet.khaledalhadi26.workers.dev";


let session =
localStorage.getItem(
    "khaled_session"
);


let savedEmail =
localStorage.getItem(
    "khaled_email"
);


const emailInput =
document.getElementById("email");


if (savedEmail) {

    emailInput.value =
        savedEmail;

}


function showMessage(text) {

    document
        .getElementById("message")
        .textContent = text;

}


async function sendOTP() {

    const email =
        emailInput.value
            .trim()
            .toLowerCase();


    if (
        !email ||
        !email.includes("@")
    ) {

        showMessage(
            "Please enter a valid email."
        );

        return;

    }


    localStorage.setItem(
        "khaled_email",
        email
    );


    const button =
        document.getElementById(
            "sendOtp"
        );


    button.disabled = true;


    showMessage(
        "Sending verification code..."
    );


    try {

        const response =
            await fetch(API, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    action:
                        "send_otp",

                    email:
                        email

                })

            });


        const data =
            await response.json();


        if (!data.success) {

            showMessage(
                data.error ||
                "Failed to send code."
            );

            button.disabled = false;

            return;

        }


        document
            .getElementById(
                "emailSection"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "otpSection"
            )
            .classList
            .remove("hidden");


        showMessage(
            "Verification code sent."
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "Connection error."
        );

        button.disabled = false;

    }

}


async function verifyOTP() {

    const email =
        emailInput.value
            .trim()
            .toLowerCase();


    const otp =
        document
            .getElementById("otp")
            .value
            .trim();


    if (!/^\d{6}$/.test(otp)) {

        showMessage(
            "Enter the 6-digit code."
        );

        return;

    }


    const button =
        document.getElementById(
            "verifyOtp"
        );


    button.disabled = true;


    showMessage(
        "Verifying..."
    );


    try {

        const response =
            await fetch(API, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    action:
                        "verify_otp",

                    email:
                        email,

                    otp:
                        otp

                })

            });


        const data =
            await response.json();


        if (!data.success) {

            showMessage(
                data.error ||
                "Verification failed."
            );

            button.disabled = false;

            return;

        }


        session =
            data.session;


        localStorage.setItem(
            "khaled_session",
            session
        );


        document
            .getElementById(
                "emailSection"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "otpSection"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "userSection"
            )
            .classList
            .remove("hidden");


        showMessage(
            "Email verified successfully!"
        );


        updateBalance();


    } catch (error) {

        console.error(error);

        showMessage(
            "Connection error."
        );

        button.disabled = false;

    }

}


async function updateBalance() {

    if (!session) {
        return;
    }


    try {

        const response =
            await fetch(API, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    action:
                        "balance",

                    session:
                        session

                })

            });


        const data =
            await response.json();


        if (!data.success) {

            localStorage.removeItem(
                "khaled_session"
            );

            session = null;

            location.reload();

            return;

        }


        document
            .getElementById("points")
            .textContent =
            Number(data.points)
                .toLocaleString();


        updateCooldown(
            data.cooldown
        );


    } catch (error) {

        console.error(error);

    }

}


async function claim() {

    if (!session) {

        showMessage(
            "Please verify your email first."
        );

        return;

    }


    const button =
        document.getElementById(
            "claimButton"
        );


    button.disabled = true;


    try {

        const response =
            await fetch(API, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    action:
                        "claim",

                    session:
                        session

                })

            });


        const data =
            await response.json();


        if (!data.success) {

            showMessage(
                data.error ||
                "Claim failed."
            );


            updateCooldown(
                data.cooldown || 0
            );


            return;

        }


        document
            .getElementById("points")
            .textContent =
            Number(data.points)
                .toLocaleString();


        showMessage(
            "+100,000,000 points added!"
        );


        updateCooldown(
            data.cooldown
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "Connection error."
        );

    } finally {

        button.disabled = false;

    }

}


async function withdraw() {

    if (!session) {

        showMessage(
            "Please verify your email first."
        );

        return;

    }


    const button =
        document.getElementById(
            "withdrawButton"
        );


    button.disabled = true;


    showMessage(
        "Processing withdrawal..."
    );


    try {

        const response =
            await fetch(API, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    action:
                        "withdraw",

                    session:
                        session

                })

            });


        const data =
            await response.json();


        if (!data.success) {

            showMessage(
                data.error ||
                "Withdrawal failed."
            );

            return;

        }


        document
            .getElementById("points")
            .textContent =
            Number(data.points)
                .toLocaleString();


        showMessage(
            "Withdrawal successful: " +
            data.usdt +
            " USDT"
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "Connection error."
        );

    } finally {

        button.disabled = false;

    }

}


function updateCooldown(seconds) {

    const button =
        document.getElementById(
            "claimButton"
        );


    const display =
        document.getElementById(
            "cooldown"
        );


    if (
        !seconds ||
        seconds <= 0
    ) {

        button.disabled = false;

        display.textContent =
            "You can claim now.";

        return;

    }


    button.disabled = true;


    let remaining =
        Number(seconds);


    display.textContent =
        `Next claim in ${remaining} seconds`;


    const timer =
        setInterval(() => {

            remaining--;


            if (remaining <= 0) {

                clearInterval(timer);

                button.disabled = false;

                display.textContent =
                    "You can claim now.";

                return;

            }


            display.textContent =
                `Next claim in ${remaining} seconds`;

        }, 1000);

}


async function restoreSession() {

    if (!session) {
        return;
    }


    document
        .getElementById(
            "emailSection"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "otpSection"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "userSection"
        )
        .classList
        .remove("hidden");


    await updateBalance();

}


restoreSession();

</script>

</body>

</html>
