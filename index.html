<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Khaled Points Faucet</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101828;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }

    .box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .reward {
      background: #f2f4f7;
      padding: 18px;
      border-radius: 12px;
      margin: 20px 0;
    }

    .reward strong {
      font-size: 22px;
    }

    .balance {
      background: #ecfdf3;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
    }

    .balance-title {
      font-size: 14px;
      margin-bottom: 5px;
    }

    .points {
      font-size: 30px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #26a17b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      min-height: 22px;
    }

    .info {
      margin-top: 20px;
      font-size: 13px;
      color: #667085;
    }

  </style>

</head>

<body>

  <div class="box">

    <h1>Khaled Points Faucet</h1>

    <p>
      Claim your free points.
    </p>

    <div class="reward">

      Reward per claim

      <br>

      <strong>
        10,000 POINTS
      </strong>

    </div>

    <div class="balance">

      <div class="balance-title">
        Your Points
      </div>

      <div class="points">
        <span id="points">0</span>
      </div>

    </div>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <button
      id="claimButton"
      onclick="claim()"
    >
      CLAIM 10,000 POINTS
    </button>

    <div id="message"></div>

    <div class="info">
      One claim every 60 seconds.
    </div>

  </div>


  <script>

    const WORKER_URL =
      "https://khaled-usdt-faucet.khaledalhadi26.workers.dev/";


    const emailInput =
      document.getElementById("email");

    const pointsElement =
      document.getElementById("points");

    const button =
      document.getElementById("claimButton");

    const message =
      document.getElementById("message");


    // =========================
    // تحميل الرصيد
    // =========================

    async function loadBalance() {

      const email =
        emailInput.value.trim().toLowerCase();

      if (!email || !email.includes("@")) {
        return;
      }

      try {

        const response =
          await fetch(WORKER_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              email: email,
              action: "balance"
            })

          });


        const result =
          await response.json();


        if (result.success) {

          pointsElement.textContent =
            Number(result.points)
              .toLocaleString();

        }

      } catch (error) {

        console.log(error);

      }
    }


    // =========================
    // Claim
    // =========================

    async function claim() {

      const email =
        emailInput.value
          .trim()
          .toLowerCase();


      if (!email || !email.includes("@")) {

        message.textContent =
          "Please enter a valid email.";

        return;
      }


      localStorage.setItem(
        "khaledEmail",
        email
      );


      button.disabled = true;

      button.textContent =
        "PROCESSING...";

      message.textContent =
        "";


      try {

        const response =
          await fetch(WORKER_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              email: email
            })

          });


        const result =
          await response.json();


        if (result.points !== undefined) {

          pointsElement.textContent =
            Number(result.points)
              .toLocaleString();

        }


        if (result.success) {

          message.textContent =
            "🎉 You received 10,000 points!";

          startCooldown(
            result.cooldown || 60
          );

        } else {

          message.textContent =
            result.message ||
            "Request failed.";

          if (result.cooldown) {

            startCooldown(
              result.cooldown
            );

          } else {

            button.disabled = false;

            button.textContent =
              "CLAIM 10,000 POINTS";

          }

        }

      } catch (error) {

        message.textContent =
          "Unable to connect to the server.";

        button.disabled = false;

        button.textContent =
          "CLAIM 10,000 POINTS";
      }

    }


    // =========================
    // المؤقت
    // =========================

    function startCooldown(seconds) {

      let remaining =
        Number(seconds);

      button.disabled = true;


      const timer =
        setInterval(() => {

          if (remaining <= 0) {

            clearInterval(timer);

            button.disabled = false;

            button.textContent =
              "CLAIM 10,000 POINTS";

            return;
          }


          button.textContent =
            `WAIT ${remaining}s`;

          remaining--;

        }, 1000);

    }


    // =========================
    // حفظ الإيميل
    // =========================

    const savedEmail =
      localStorage.getItem("khaledEmail");


    if (savedEmail) {

      emailInput.value =
        savedEmail;

      loadBalance();

    }


    // تحميل الرصيد عند تغيير الإيميل
    emailInput.addEventListener(
      "change",
      loadBalance
    );

  </script>

</body>

</html>
